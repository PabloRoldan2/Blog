<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- Encabezado del Sitio Web -->
    <header>
        <h1>Mi Blog Personal</h1>
    </header>

    <!-- Contenedor Principal de Artículos -->
    <main class="contenedor-principal">

        <!-- Seccion del Buscador y Acciones -->
        <section class="panel-acciones">
            <div class="input-grupo">
                <input type="text" id="articulo-id" placeholder="Ingresa el ID del artículo (ej: 66e3c8f1...)">
            </div>

            <div class="botones-grupo">
                <button id="btn-buscar" class="btn btn-buscar">Buscar</button>
                <button id="btn-crear" class="btn btn-crear" onclick = "location.href = 'crear.html'">Crear</button>
                <button id="btn-actualizar" class="btn btn-actualizar" onclick = "location.href = 'update.html'">Editar</button>
                <button id="btn-eliminar" class="btn btn-eliminar" onclick = "location.href = 'delete.html'">Eliminar</button>
            </div>
        </section>


        <!-- Tarjeta donde se insertará la información recibida desde la API -->
        <article class="tarjeta-articulo" id="articulo-contenedor">
            <header class="articulo-header">
                <h2 id="articulo-titulo">Cargando título...</h2>
                <span class="articulo-fecha" id="articulo-fecha">--/--/----</span>
            </header>

            <section class="articulo-cuerpo">
                <p id="articulo-contenido">El contenido de la publicación aparecerá aquí.</p>
            </section>
        </article>

    </main>

    <!-- Script donde consumes tu API creada con Express -->
    <script src="Script_index.js"></script>
</body>

</html>
